{% extends 'base.html' %}
{% block title %}Profile — Custom Corner{% endblock %}
{% block content %}
<section class="w-full py-10">
  <div class="max-w-[1100px] mx-auto px-5 lg:px-10">
    <h1 class="font-display text-3xl font-semibold text-primary tracking-tight mb-6">My Account</h1>
    {% include 'partials/account_nav.html' %}

    <div class="max-w-lg mt-8 bg-surface-container-lowest border border-outline-variant/40 rounded-lg p-6">
      <h2 class="font-semibold text-on-surface mb-4">Profile Information</h2>
      <form method="post" class="space-y-4">
        <div>
          <label class="text-xs text-on-surface-variant block mb-1">Full Name</label>
          <input name="name" required value="{{ user.name }}" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant text-sm focus:border-primary focus:outline-none">
        </div>
        <div>
          <label class="text-xs text-on-surface-variant block mb-1">Email</label>
          <input value="{{ user.email }}" disabled class="w-full px-3 py-2.5 rounded-lg border border-outline-variant bg-surface-container text-sm text-on-surface-variant">
        </div>
        <div>
          <label class="text-xs text-on-surface-variant block mb-1">Phone</label>
          <input name="phone" value="{{ user.phone or '' }}" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant text-sm focus:border-primary focus:outline-none">
        </div>
        <button type="submit" class="bg-primary text-on-primary font-semibold px-6 py-2.5 rounded-lg hover:bg-primary-container transition-colors">Save Changes</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
