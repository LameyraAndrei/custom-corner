{% extends 'base.html' %}
{% block title %}Create Account — Custom Corner{% endblock %}
{% block content %}
<section class="w-full py-16 flex items-center justify-center flex-1">
  <div class="w-full max-w-md px-5">
    <div class="bg-surface-container-lowest border border-outline-variant/40 rounded-xl p-8 shadow-sm">
      <h1 class="font-display text-2xl font-semibold text-primary tracking-tight mb-1 text-center">Create Your Account</h1>
      <p class="text-sm text-on-surface-variant text-center mb-6">Join Custom Corner and start designing.</p>
      <form method="post" class="space-y-4">
        <div>
          <label class="text-xs text-on-surface-variant block mb-1">Full Name</label>
          <input name="name" required value="{{ form.name or '' }}" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant text-sm focus:border-primary focus:outline-none">
        </div>
        <div>
          <label class="text-xs text-on-surface-variant block mb-1">Email</label>
          <input type="email" name="email" required value="{{ form.email or '' }}" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant text-sm focus:border-primary focus:outline-none">
        </div>
        <div>
          <label class="text-xs text-on-surface-variant block mb-1">Phone Number</label>
          <input name="phone" value="{{ form.phone or '' }}" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant text-sm focus:border-primary focus:outline-none">
        </div>
        <div>
          <label class="text-xs text-on-surface-variant block mb-1">Password</label>
          <input type="password" name="password" required minlength="6" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant text-sm focus:border-primary focus:outline-none">
        </div>
        <div>
          <label class="text-xs text-on-surface-variant block mb-1">Confirm Password</label>
          <input type="password" name="confirm_password" required minlength="6" class="w-full px-3 py-2.5 rounded-lg border border-outline-variant text-sm focus:border-primary focus:outline-none">
        </div>
        <button type="submit" class="w-full bg-primary text-on-primary font-semibold py-3 rounded-lg hover:bg-primary-container transition-colors">Create Account</button>
      </form>
      <p class="text-center text-sm text-on-surface-variant mt-6">Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary font-semibold hover:underline">Log in</a></p>
    </div>
  </div>
</section>
{% endblock %}
